name: CI

on:
    push:
        branches: ["main"]
        paths:
            - "**"
            - "!README.md"
            - "!.gitignore"
            - "!.github/workflows/**"
            - ".github/workflows/ci.yml"
    pull_request:

env:
    CARGO_TERM_COLOR: always

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-v1-${{ hashFiles('**/Cargo.lock') }}
            - run: cargo fmt --all --check
            - env:
                  CARGO_BUILD_WARNINGS: deny
              run: cargo clippy --all-targets --locked

    build:
        needs: lint
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-v1-${{ hashFiles('**/Cargo.lock') }}
            - uses: cda-tum/setup-z3@v1.7.3
              with:
                  version: 4.16.0 # same version as the z3-src dependency under the z3-sys crate
                  add_to_library_path: true
            - run: cargo test --all-targets --no-fail-fast --locked
